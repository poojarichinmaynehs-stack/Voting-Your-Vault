<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>Suman's Secret Vault 💖</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #f3e5ab 100%); min-height: 100vh; color: #4a4a4a; padding: 20px; padding-bottom: 80px; }
        
        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .header h1 { color: #db7093; font-size: 2.5rem; text-shadow: 0 2px 10px rgba(219, 112, 147, 0.2); }
        .header p { color: #888; font-size: 14px; margin-top: 5px; font-weight: 500;}

        .upload-card { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3); max-width: 500px; margin: 0 auto 40px auto; text-align: center; }
        
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; margin-bottom: 15px; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .btn { background: linear-gradient(135deg, #ff69b4 0%, #da70d6 100%); color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(244, 63, 94, 0.3); transition: all 0.3s; display: inline-block; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(244, 63, 94, 0.5); }
        
        #loadingMsg { display: none; color: #ff69b4; font-weight: bold; margin-top: 10px; font-size: 14px; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

        /* CLOUD GALLERY GRID */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .gallery-item { position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 3px solid white; background: white; aspect-ratio: 1 / 1; animation: popIn 0.5s ease-out forwards; cursor: pointer; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
        .gallery-item:hover img { transform: scale(1.05); }
        
        .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.8); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .nav-btn { position: fixed; top: 20px; left: 20px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.8); padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <button class="nav-btn" onclick="window.location.href='cutu26.html'">⬅ Back to Gift</button>

    <div class="header">
        <h1>Cloud Vault ☁️🌸</h1>
        <p>Live Connected to ImgBB Server</p>
    </div>

    <!-- UPLOAD SECTION -->
    <div class="upload-card">
        <h3 style="color: #db7093; margin-bottom: 15px;">Add a new cloud memory ✨</h3>
        <div class="file-input-wrapper">
            <button class="btn">Select & Upload Photo 🚀</button>
            <input type="file" id="imageInput" accept="image/jpeg, image/png, image/jpg" onchange="uploadToCloud()">
        </div>
        <p id="loadingMsg">Uploading to Cloud Database... Please wait ☁️⏳</p>
    </div>

    <!-- GALLERY SECTION -->
    <div class="gallery-grid" id="galleryContainer"></div>

    <script>
        // TERI SECRET CLOUD API KEY
        const IMGBB_API_KEY = "E59dffa4691f853680e4c3efc19b2703";

        window.addEventListener('DOMContentLoaded', loadGallery);

        function uploadToCloud() {
            const input = document.getElementById('imageInput');
            const loadingMsg = document.getElementById('loadingMsg');
            
            if (!input.files || input.files.length === 0) return;
            
            const file = input.files[0];
            loadingMsg.style.display = "block"; // Loader on
            
            // Preparing data for ImgBB Cloud
            const formData = new FormData();
            formData.append("image", file);
            
            // Fetch Request to Cloud API
            fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    const cloudImageUrl = data.data.display_url;
                    saveToMemory(cloudImageUrl);
                    loadingMsg.style.display = "none";
                    input.value = ""; // Reset input
                } else {
                    alert("Cloud Upload Failed! Try again.");
                    loadingMsg.style.display = "none";
                }
            })
            .catch(error => {
                alert("Internet connection error.");
                loadingMsg.style.display = "none";
            });
        }

        function saveToMemory(cloudUrl) {
            let cloudVault = JSON.parse(localStorage.getItem('sumanCloudVault')) || [];
            // Push naya image link sabse upar
            cloudVault.unshift(cloudUrl);
            localStorage.setItem('sumanCloudVault', JSON.stringify(cloudVault));
            loadGallery(); 
        }

        function loadGallery() {
            const container = document.getElementById('galleryContainer');
            let cloudVault = JSON.parse(localStorage.getItem('sumanCloudVault')) || [];

            if (cloudVault.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#999; font-weight: bold;'>Vault is empty. Upload your first photo to the cloud! ☁️</p>";
                return;
            }

            container.innerHTML = cloudVault.map((imgLink, index) => `
                <div class="gallery-item">
                    <img src="${imgLink}" alt="Cloud Memory">
                    <button class="delete-btn" onclick="deletePhoto(${index})">✖</button>
                </div>
            `).join('');
        }

        function deletePhoto(index) {
            let cloudVault = JSON.parse(localStorage.getItem('sumanCloudVault')) || [];
            cloudVault.splice(index, 1);
            localStorage.setItem('sumanCloudVault', JSON.stringify(cloudVault));
            loadGallery();
        }
    </script>
</body>
</html>
