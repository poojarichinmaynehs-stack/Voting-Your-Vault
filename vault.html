<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside The Vault ✨</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .options-panel {
            display: none;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
              .option-btn {
            padding: 10px 15px;
            font-size: 14px;
            margin: 8px auto;
            width: 95%; /* Phone pe poori jagah lega */
            display: block; /* Ek ke neeche ek aayega mast */
            white-space: nowrap; /* Text ko tootne se rokega */
            border-radius: 20px;
        }

        .year-tag {
            background: #ff9a9e;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="vault-body">
    <div class="hearts-container">
        <div class="heart">💖</div><div class="heart">❤️</div><div class="heart">💕</div>
    </div>

    <div class="dashboard" style="flex-direction: column;">
        
        <!-- TOP HEADER & NOTIFICATION BELL -->
        <div class="glass-panel" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; padding: 15px 25px;">
            <h2 style="margin: 0; color: #333;">Dashboard ✨</h2>
            
            <div style="position: relative; cursor: pointer;" onclick="toggleNotifs()">
                <div style="font-size: 26px;">🔔</div>
                <div id="notifBadge" style="background: #ff4757; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; font-weight: bold; position: absolute; top: -2px; right: -5px; display: none;">0</div>
                
                <div id="notifDropdown" class="glass-panel" style="display: none; position: absolute; right: 0; top: 45px; width: 300px; max-height: 250px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 15px;">
                    <h4 style="margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; color: #333;">Recent Activity</h4>
                    <div id="notifList" style="font-size: 13px; color: #555; text-align: left;">
                        Koi nayi activity nahi hai.
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div style="display: flex; gap: 20px; width: 100%; flex: 1;">
            
            <!-- LEFT: Dynamic Folders with Admin Master Control -->
            <div class="gallery-section glass-panel">
                <h2>Memories Vault 📸</h2>
                <div class="album-grid" id="folderGrid">
                    <!-- JavaScript handles secure rendering here -->
                </div>
            </div>

            <!-- RIGHT: Live Chat -->
            <div class="chat-section glass-panel">
                <h2>Live Chat 💬</h2>
                <div class="chat-box" id="chatBox"></div>
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button class="cute-btn send-btn">Send</button>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgt_FpIn3fqUsSJGe7L7gr4wApPZEdMos",
            authDomain: "yourvault-f650c.firebaseapp.com",
            projectId: "yourvault-f650c",
            storageBucket: "yourvault-f650c.firebasestorage.app",
            messagingSenderId: "777606101043",
            appId: "1:777606101043:web:33e47a67decdf40c224b46"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loggedInUser = localStorage.getItem("vaultUser") || "guest";
        const displayName = loggedInUser.charAt(0).toUpperCase() + loggedInUser.slice(1);

        window.toggleNotifs = () => {
            const dropdown = document.getElementById("notifDropdown");
            dropdown.style.display = dropdown.style.display === "none" ? "block" : "none";
        };

        window.toggleBdayOptions = () => {
            const panel = document.getElementById("bdayOptionsPanel");
            panel.style.display = panel.style.display === "none" ? "block" : "none";
        };

        const notifBadge = document.getElementById("notifBadge");
        const notifList = document.getElementById("notifList");
        const notifQuery = query(collection(db, "notifications"), orderBy("timestamp", "desc"));
        
        onSnapshot(notifQuery, (snapshot) => {
            if (!snapshot.empty) {
                notifBadge.style.display = "block";
                notifBadge.innerText = snapshot.size;
                notifList.innerHTML = ""; 
                snapshot.forEach(doc => {
                    const data = doc.data();
                    notifList.innerHTML += `<div style="padding: 10px; background: rgba(255,255,255,0.8); border-radius: 8px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">${data.message}</div>`;
                });
            }
        });

        const folderGrid = document.getElementById("folderGrid");
        
        // --- ADMIN MULTI-USER MASTER CONTROL ---
        if (loggedInUser === "chinmay") {
            folderGrid.innerHTML = `
                <!-- ADMIN MASTER SEARCH PANEL -->
                <div class="album-card" style="text-align: left; border: 2px solid #ff9a9e; background: #fffafb;">
                    <div style="text-align: center;">
                        <div class="folder-icon">👑</div>
                        <h3>Admin Master Control</h3>
                        <p>Manage Any User's Vault</p>
                    </div>
                    
                    <div style="margin-top: 15px;">
                        <input type="text" id="adminUserSearch" placeholder="Type name (e.g. suman, jiya)" style="width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #ff9a9e; outline: none; margin-bottom: 10px; font-size: 14px; text-align: center;">
                        
                        <div style="display: flex; gap: 5px;">
                            <button class="cute-btn" onclick="openAdminGallery()" style="flex: 1; padding: 8px; margin: 0; font-size: 12px;">📸 Gallery (Upload)</button>
                            <button class="cute-btn" onclick="openAdminBday()" style="flex: 1; padding: 8px; margin: 0; font-size: 12px;">🎂 View Bdayweb</button>
                        </div>
                    </div>
                </div>

                <!-- FRIENDS OUTING (Common) -->
                <div class="album-card" onclick="window.location.href='gallery.html?folder=friends'" style="display: flex; flex-direction: column; justify-content: center;">
                    <div class="folder-icon">🏕️</div>
                    <h3>Friends Outing</h3>
                    <p>Shared Group Pics & Videos</p>
                </div>
            `;

            // Admin Actions
            window.openAdminGallery = () => {
                const targetUser = document.getElementById("adminUserSearch").value.toLowerCase().trim();
                if(!targetUser) { alert("Pehle dabe mein naam likh bhai!"); return; }
                // Direct target user ki 2026 gallery open hogi
                window.location.href = `gallery.html?folder=${targetUser}_2026`;
            };

            window.openAdminBday = () => {
                const targetUser = document.getElementById("adminUserSearch").value.toLowerCase().trim();
                if(!targetUser) { alert("Pehle dabe mein naam likh bhai!"); return; }
                
                // Agar Suman hai toh uski special file open hogi, baaki sabke liye dynamic common file
                if(targetUser === "suman") {
                    window.location.href = "cutu26.html";
                } else {
                    window.location.href = `birthday.html?folder=${targetUser}`;
                }
            };

        } else {
            
            let bdayPageLink = "birthday.html?folder=" + loggedInUser; 
            
            // Special cases
            if(loggedInUser === "suman") { 
                bdayPageLink = "cutu26.html"; 
            } else if(loggedInUser === "nathasha") {
                // Yahan ensure kar ki file ka naam ekdum match ho
                bdayPageLink = "Akkos26.html";
            }


            folderGrid.innerHTML = `
                <!-- USER'S OWN PRIVATE VAULT -->
                <div class="album-card" style="text-align: left;">
                    <div style="text-align: center;">
                        <div class="folder-icon">🎂</div>
                        <h3>${displayName}'s Personal Vault</h3>
                        <p>Private Yearly Celebrations</p>
                    </div>
                    <button class="cute-btn" onclick="toggleBdayOptions()" style="margin-top: 10px; padding: 8px;">Open Year: 2026 📂</button>
                    
                    <div id="bdayOptionsPanel" class="options-panel">
                        <span class="year-tag">Year 2026</span><br>
                        <button class="cute-btn option-btn" onclick="window.location.href='gallery.html?folder=${loggedInUser}_2026'">📸 My Gallery</button>
                        <button class="cute-btn option-btn" onclick="window.location.href='${bdayPageLink}'">🎂 My Bdayweb</button>
                    </div>
                </div>

                <!-- FRIENDS OUTING (Common) -->
                <div class="album-card" onclick="window.location.href='gallery.html?folder=friends'" style="display: flex; flex-direction: column; justify-content: center;">
                    <div class="folder-icon">🏕️</div>
                    <h3>Friends Outing</h3>
                    <p>Shared Group Pics & Videos</p>
                </div>
            `;
        }

        // LIVE CHAT
        const chatBox = document.getElementById("chatBox");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.querySelector(".send-btn");

        sendBtn.addEventListener("click", async () => {
            const text = messageInput.value.trim();
            if (text !== "") {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    sender: displayName,
                    timestamp: serverTimestamp()
                });
                messageInput.value = "";
            }
        });

        const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const msgDiv = document.createElement("div");
                msgDiv.className = "message";
                msgDiv.innerHTML = `<span class="sender">${data.sender}:</span> ${data.text}`;
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
