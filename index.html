<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Your Vault</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body>
    <div class="light light-1"></div>
    <div class="light light-2"></div>
    <div class="light light-3"></div>
    <div class="light light-4"></div>
    <div class="light light-5"></div>
    <div class="light light-6"></div>
    <div class="light light-7"></div>
    <div class="light light-8"></div>

    <div class="hearts-container">
        <div class="heart">💖</div>
        <div class="heart">❤️</div>
        <div class="heart">💕</div>
        <div class="heart">💖</div>
        <div class="heart">💗</div>
        <div class="heart">❤️</div>
        <div class="heart">💕</div>
    </div>

    <div class="login-container">
        <h2>Voting Your Vault ✨</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Name</label>
                <input type="text" id="username" placeholder="Enter your nickname" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="cute-btn">Submit 💖</button>
        </form>
    </div>

    <script type="module" src="app.js"></script> 
</body>
</html>
