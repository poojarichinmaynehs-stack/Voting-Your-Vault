<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Gallery ✨</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- 🔍 FULL SCREEN ZOOM MODAL CSS -->
    <style>
        #imageModal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.85); 
            backdrop-filter: blur(5px);
        }
        #modalImage {
            margin: auto;
            display: block;
            width: 95%;
            max-width: 800px;
            max-height: 85vh;
            margin-top: 5vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 154, 158, 0.5);
            animation: zoomIn 0.3s ease-in-out;
        }
        @keyframes zoomIn {
            from {transform: scale(0.8); opacity: 0;}
            to {transform: scale(1); opacity: 1;}
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .close-btn:hover { color: #ff9a9e; }
    </style>
</head>
<body class="vault-body">
    
    <button class="cute-btn back-btn" style="position:absolute; top:15px; left:15px;" onclick="window.location.href='vault.html'">⬅ Back to Vault</button>

    <div class="dashboard" style="flex-direction: column; align-items: center; max-width: 600px; margin: 60px auto 20px auto;">
        
        <div class="glass-panel" style="width: 100%; text-align: center; margin-bottom: 20px; padding: 20px;">
            <h2 id="galleryTitle" style="margin-bottom: 10px;">Gallery ✨</h2>
            
            <div id="adminUploadSection" style="display: none; margin-top: 15px; border-top: 1px solid #ff9a9e; padding-top: 15px;">
                <p style="font-size: 13px; color: #777; margin-bottom: 10px;">Admin Cloud Upload 👑</p>
                <input type="file" id="uploadInput" accept="image/*,video/*" multiple style="margin-bottom: 10px; font-size: 12px;"> 
                <button class="cute-btn" onclick="uploadToCloud()" style="padding: 8px 15px; font-size: 14px;">Upload Media 🚀</button>
                <p id="loadingMsg" style="display: none; font-size: 14px; font-weight: bold; color: #db7093; margin-top: 10px;">Uploading...</p>
            </div>
        </div>

        <div class="photo-grid" id="photoGrid" style="width: 100%; display: flex; flex-direction: column; gap: 20px;">
            <!-- Photos & Videos yahan aayengi -->
        </div>

        <div class="comments-panel glass-panel" style="width: 100%; margin-top: 20px; padding: 20px;">
            <h3 style="margin-bottom: 15px;">Folder Guestbook ✍️</h3>
            <div id="commentsList" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px; text-align: left; padding: 10px; background: rgba(255,255,255,0.6); border-radius: 10px;">
                <p style="color:#999; font-size:12px; text-align:center;">Loading comments...</p>
            </div>
            <div class="comment-input-box" style="display: flex; gap: 10px;">
                <input type="text" id="commentInput" placeholder="Leave a memory here..." style="flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ff9a9e; outline: none;">
                <button class="cute-btn" id="sendCommentBtn" style="padding: 10px 20px; margin: 0;">Send</button>
            </div>
        </div>

    </div>

    <!-- 🔍 MODAL DABBA FOR PHOTOS -->
    <div id="imageModal" onclick="closeZoom()">
        <span class="close-btn" onclick="closeZoom()">×</span>
        <img id="modalImage">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgt_FpIn3fqUsSJGe7L7gr4wApPZEdMos",
            authDomain: "yourvault-f650c.firebaseapp.com",
            projectId: "yourvault-f650c",
            storageBucket: "yourvault-f650c.firebasestorage.app",
            messagingSenderId: "777606101043",
            appId: "1:777606101043:web:33e47a67decdf40c224b46"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const folderName = urlParams.get('folder') || 'default_folder';
        const loggedInUser = (localStorage.getItem("vaultUser") || "guest").toLowerCase();
        const displayName = loggedInUser.charAt(0).toUpperCase() + loggedInUser.slice(1);

        document.getElementById('galleryTitle').innerText = folderName.replace('_', ' ') + " Gallery 📸";

        if (loggedInUser === "chinmay") {
            document.getElementById("adminUploadSection").style.display = "block";
        }

        // --- ZOOM IN / OUT ---
        window.openZoom = (url) => {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = "block";
            modalImg.src = url;
        };

        window.closeZoom = () => {
            document.getElementById('imageModal').style.display = "none";
        };

        window.openCommentBoxes = {};
        window.typingValues = {};

        // --- LIKES & COMMENTS LOGIC ❤️💬 ---
        window.toggleLike = async (docId, isLiked) => {
            const photoRef = doc(db, "galleryPhotos", docId);
            if (isLiked) {
                await updateDoc(photoRef, { likes: arrayRemove(loggedInUser) });
            } else {
                await updateDoc(photoRef, { likes: arrayUnion(loggedInUser) });
            }
        };

        window.toggleCommentBox = (docId) => {
            const box = document.getElementById(`commentBox-${docId}`);
            if (box.style.display === "none") {
                box.style.display = "block";
                window.openCommentBoxes[docId] = true;
            } else {
                box.style.display = "none";
                window.openCommentBoxes[docId] = false;
            }
        };

        window.saveTyping = (docId, val) => {
            window.typingValues[docId] = val;
        };

        window.sendPhotoComment = async (docId) => {
            const text = window.typingValues[docId] || "";
            if (text.trim() === "") return;
            
            const photoRef = doc(db, "galleryPhotos", docId);
            await updateDoc(photoRef, {
                comments: arrayUnion({ sender: displayName, text: text.trim(), time: Date.now() })
            });
            window.typingValues[docId] = ""; 
        };

        // 🚀 CLOUDINARY UPLOAD LOGIC (PHOTOS + VIDEOS) 🚀
        window.uploadToCloud = async () => {
            const fileInput = document.getElementById('uploadInput');
            const loadingMsg = document.getElementById('loadingMsg');
            const files = fileInput.files;
            
            if (files.length === 0) {
                alert("Bhai pehle photo ya video toh select kar!");
                return;
            }
            
            loadingMsg.style.display = "block";

            // 🔥 TERA CLOUDINARY SETTINGS YAHAN HAI 🔥
            const cloudName = "X4ca5isx"; 
            const uploadPreset = "qrrxqar1"; 

            for (let i = 0; i < files.length; i++) {
                let currentFile = files[i];
                loadingMsg.innerText = `Uploading file ${i + 1} of ${files.length}... ⏳`;
                
                let formData = new FormData();
                formData.append("file", currentFile);
                formData.append("upload_preset", uploadPreset);

                // Check if Video or Image
                const isVideo = currentFile.type.startsWith("video/");
                const resourceType = isVideo ? "video" : "image";
                
                // Cloudinary ka API Link
                const uploadUrl = `https://api.cloudinary.com/v1_1/${cloudName}/${resourceType}/upload`;

                try {
                    const response = await fetch(uploadUrl, { method: "POST", body: formData });
                    const data = await response.json();

                    if(data.secure_url) {
                        // Firebase Database mein link save kar rahe hain
                        await addDoc(collection(db, "galleryPhotos"), {
                            folder: folderName,
                            url: data.secure_url,
                            type: resourceType, 
                            timestamp: serverTimestamp(),
                            likes: [],
                            comments: []
                        });
                    } else {
                        console.error("Upload Error:", data);
                        alert(`Upload fail hua! Error: ${data.error.message}`);
                    }
                } catch (err) { 
                    console.error("Fetch Error:", err); 
                }
            } 

            loadingMsg.innerText = "All Media Uploaded! ✨🎬📸";
            fileInput.value = ""; 
            setTimeout(() => { loadingMsg.style.display = "none"; }, 3000);
        };

        // --- LIVE LOAD PHOTOS & VIDEOS FROM FIREBASE ---
        const photosQuery = query(collection(db, "galleryPhotos"), where("folder", "==", folderName));
        onSnapshot(photosQuery, (snapshot) => {
            const grid = document.getElementById('photoGrid');
            if (snapshot.empty) {
                grid.innerHTML = "<p style='color:#888; text-align:center;'>No memories uploaded yet. ✨</p>";
                return;
            }
            grid.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                
                const likes = data.likes || [];
                const isLiked = likes.includes(loggedInUser);
                const likeIcon = isLiked ? '❤️' : '🤍';
                
                const comments = data.comments || [];
                let commentsHTML = "";
                if(comments.length === 0) {
                    commentsHTML = "<p style='color:#999; margin:0; font-size: 12px; font-style: italic;'>No comments yet.</p>";
                } else {
                    comments.forEach(c => {
                        commentsHTML += `<div style="margin-bottom:6px; font-size: 13px; border-bottom: 1px solid #ffe4e1; padding-bottom: 4px;">
                            <strong style="color: #db7093;">${c.sender}:</strong> <span style="color:#555;">${c.text}</span>
                        </div>`;
                    });
                }

                const displayState = window.openCommentBoxes[docId] ? 'block' : 'none';
                const currentTypedText = window.typingValues[docId] || '';

                // 🔥 CHECK MEDIA TYPE (PHOTO YA VIDEO) 🔥
                let mediaElement = "";
                if (data.type === "video") {
                    mediaElement = `<video src="${data.url}" controls playsinline style="width: 100%; height: 300px; object-fit: cover; border-radius: 12px; background: #000;"></video>`;
                } else {
                    mediaElement = `<img src="${data.url}" alt="Memory" onclick="openZoom('${data.url}')" style="width: 100%; height: 300px; object-fit: cover; border-radius: 12px; cursor: pointer;">`;
                }

                grid.innerHTML += `
                    <div class="photo-card" style="background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left;">
                        
                        <!-- Media Container -->
                        ${mediaElement}
                        
                        <!-- Like / Comment / Download Action Bar -->
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                            <div style="display: flex; gap: 10px;">
                                <button class="cute-btn" onclick="toggleLike('${docId}', ${isLiked})" style="margin:0; padding: 6px 15px; border-radius: 20px; font-size: 14px;">
                                    ${likeIcon} <span style="font-weight: bold; margin-left: 3px;">${likes.length}</span>
                                </button>
                                <button class="cute-btn" onclick="toggleCommentBox('${docId}')" style="margin:0; padding: 6px 15px; border-radius: 20px; font-size: 14px;">
                                    💬 <span style="font-weight: bold; margin-left: 3px;">${comments.length}</span>
                                </button>
                            </div>
                            <a href="${data.url}" target="_blank" download class="cute-btn" style="margin:0; padding: 6px 15px; border-radius: 20px; text-decoration: none;">📥</a>
                        </div>

                        <!-- Per-Photo Comment Input -->
                        <div id="commentBox-${docId}" style="display: ${displayState}; margin-top: 15px; background: #fffafb; padding: 12px; border-radius: 12px; border: 1px solid #ffe4e1;">
                            <div style="max-height: 120px; overflow-y: auto; margin-bottom: 10px;">
                                ${commentsHTML}
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" onkeyup="saveTyping('${docId}', this.value)" value="${currentTypedText}" placeholder="Add comment..." style="flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #ff9a9e; outline: none; font-size: 13px;">
                                <button class="cute-btn" onclick="sendPhotoComment('${docId}')" style="margin:0; padding: 8px 15px; border-radius: 20px; font-size: 13px;">Send</button>
                            </div>
                        </div>

                    </div>
                `;
            });
        });

        // --- GLOBAL FOLDER COMMENTS SYSTEM ---
        const commentInput = document.getElementById("commentInput");
        const sendCommentBtn = document.getElementById("sendCommentBtn");

        sendCommentBtn.addEventListener("click", async () => {
            const text = commentInput.value.trim();
            if (text !== "") {
                await addDoc(collection(db, "galleryComments"), {
                    folder: folderName,
                    sender: displayName,
                    text: text,
                    timestamp: serverTimestamp()
                });
                commentInput.value = "";
            }
        });

        const commentsQuery = query(collection(db, "galleryComments"), where("folder", "==", folderName));
        onSnapshot(commentsQuery, (snapshot) => {
            const commentsList = document.getElementById('commentsList');
            if (snapshot.empty) { return; }
            commentsList.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                commentsList.innerHTML += `
                    <div class="comment-item" style="padding: 5px 0; border-bottom: 1px solid #eee;">
                        <strong style="color: #db7093;">${data.sender}:</strong> <span style="color: #555;">${data.text}</span>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
