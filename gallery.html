<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery 📸</title>
    
    <style>
        body { background: #fff0f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 20px; color: #4a4a4a; margin: 0; }
        .header-panel { background: rgba(255,255,255,0.7); padding: 20px; border-radius: 16px; display: inline-block; margin-bottom: 20px; margin-top: 40px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h2 { color: #db7093; margin: 0 0 15px 0; text-transform: capitalize; }
        
        .cute-btn { background: #ff9a9e; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4); }
        .back-btn { position: absolute; left: 15px; top: 15px; background: rgba(255,255,255,0.8); color: #db7093; border: 1px solid #ff9a9e; }
        
        input[type="file"] { margin-bottom: 10px; font-size: 14px; }
        #loadingMsg { display: none; color: #ff69b4; font-weight: bold; margin-top: 10px; animation: blink 1s infinite; font-size: 14px; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* GRID SYSTEM */
        .photo-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; max-width: 900px; margin: 0 auto; }
        .photo-grid img { width: 160px; height: 160px; object-fit: cover; border-radius: 12px; border: 3px solid white; box-shadow: 0 8px 15px rgba(0,0,0,0.1); animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <!-- YEH BUTTON WAPAS TERE VAULT.HTML DASHBOARD PE BHEJEGA -->
    <button class="cute-btn back-btn" onclick="window.location.href='vault.html'">⬅ Back to Vault</button>
    
    <div class="header-panel">
        <h2 id="galleryTitle">Gallery ✨</h2>
        <p style="font-size: 13px; color: #777; margin-bottom: 15px;">Live Cloud Upload (No Hang!)</p>
        
        <input type="file" id="uploadInput" accept="image/jpeg, image/png, image/jpg">
        <button class="cute-btn" onclick="uploadToCloud()">Upload to Cloud 🚀</button>
        <p id="loadingMsg">Uploading photo directly to internet... Please wait ☁️⏳</p>
    </div>

    <!-- PHOTOS YAHAN AAYENGI -->
    <div class="photo-grid" id="photoGrid"></div>

    <script>
        // TERI CLOUD API KEY
        const API_KEY = "E59dffa4691f853680e4c3efc19b2703";
        
        // CHECK KAR RAHA HAI KI KAUNSA FOLDER OPEN HUA HAI (Suman, Friends, etc.)
        const urlParams = new URLSearchParams(window.location.search);
        const folderName = urlParams.get('folder') || 'default_folder';
        
        document.getElementById('galleryTitle').innerText = folderName.replace('_', ' ') + " Gallery 📸";

        function uploadToCloud() {
            const fileInput = document.getElementById('uploadInput');
            const loadingMsg = document.getElementById('loadingMsg');
            
            if (!fileInput.files.length) return;
            
            loadingMsg.style.display = "block"; // Loader ON
            
            let formData = new FormData();
            formData.append("image", fileInput.files[0]);

            fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    // Cloud se link mila, ab isko folder ke naam se save kar
                    saveToLocal(data.data.display_url);
                    loadingMsg.style.display = "none";
                    fileInput.value = ""; 
                } else {
                    alert("Upload fail! Cloud API mein error aaya.");
                    loadingMsg.style.display = "none";
                }
            })
            .catch(err => {
                alert("Internet Error! Check connection.");
                loadingMsg.style.display = "none";
            });
        }

        // FOLDER KE HISAAB SE SEPARATE SAVE KAREGA
        function saveToLocal(url) {
            const storageKey = 'vaultGalleryData_' + folderName;
            let images = JSON.parse(localStorage.getItem(storageKey)) || [];
            images.unshift(url);
            localStorage.setItem(storageKey, JSON.stringify(images));
            loadGallery();
        }

        function loadGallery() {
            const grid = document.getElementById('photoGrid');
            const storageKey = 'vaultGalleryData_' + folderName;
            let images = JSON.parse(localStorage.getItem(storageKey)) || [];
            
            if(images.length === 0) {
                grid.innerHTML = "<p style='color:#888; width: 100%;'>No memories yet. Upload your first photo! ✨</p>";
                return;
            }
            grid.innerHTML = images.map(img => `<img src="${img}" alt="Cloud Memory">`).join('');
        }

        // Page load hote hi photos dikhao
        window.onload = loadGallery;
    </script>
</body>
</html>
