<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Gallery ✨</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- 🔍 FULL SCREEN ZOOM MODAL CSS -->
    <style>
        #imageModal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.85); /* Black transparent background */
            backdrop-filter: blur(5px);
        }
        #modalImage {
            margin: auto;
            display: block;
            width: 95%;
            max-width: 800px;
            max-height: 85vh;
            margin-top: 5vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 154, 158, 0.5);
            animation: zoomIn 0.3s ease-in-out;
        }
        @keyframes zoomIn {
            from {transform: scale(0.8); opacity: 0;}
            to {transform: scale(1); opacity: 1;}
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .close-btn:hover { color: #ff9a9e; }
    </style>
</head>
<body class="vault-body">
    
    <button class="cute-btn back-btn" style="position:absolute; top:15px; left:15px;" onclick="window.location.href='vault.html'">⬅ Back to Vault</button>

    <div class="dashboard" style="flex-direction: column; align-items: center; max-width: 600px; margin: 60px auto 20px auto;">
        
        <div class="glass-panel" style="width: 100%; text-align: center; margin-bottom: 20px; padding: 20px;">
            <h2 id="galleryTitle" style="margin-bottom: 10px;">Gallery ✨</h2>
            
            <div id="adminUploadSection" style="display: none; margin-top: 15px; border-top: 1px solid #ff9a9e; padding-top: 15px;">
                <p style="font-size: 13px; color: #777; margin-bottom: 10px;">Admin Cloud Upload 👑</p>
                <!-- YAHAN MULTIPLE ADDED HAI -->
                <input type="file" id="uploadInput" accept="image/*" multiple style="margin-bottom: 10px; font-size: 12px;"> 
                <button class="cute-btn" onclick="uploadToCloud()" style="padding: 8px 15px; font-size: 14px;">Upload to Cloud 🚀</button>
                <p id="loadingMsg" style="display: none; font-size: 14px; font-weight: bold; color: #db7093; margin-top: 10px;">Uploading...</p>
            </div>
        </div>

        <div class="photo-grid" id="photoGrid" style="width: 100%; display: flex; flex-direction: column; gap: 20px;">
            <!-- Photos yahan Javascript se load hongi -->
        </div>

        <div class="comments-panel glass-panel" style="width: 100%; margin-top: 20px; padding: 20px;">
            <h3 style="margin-bottom: 15px;">Memory Comments 💬</h3>
            <div id="commentsList" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px; text-align: left; padding: 10px; background: rgba(255,255,255,0.6); border-radius: 10px;">
                <p style="color:#999; font-size:12px; text-align:center;">Loading comments...</p>
            </div>
            <div class="comment-input-box" style="display: flex; gap: 10px;">
                <input type="text" id="commentInput" placeholder="Write a comment..." style="flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ff9a9e; outline: none;">
                <button class="cute-btn" id="sendCommentBtn" style="padding: 10px 20px; margin: 0;">Send</button>
            </div>
        </div>

    </div>

    <!-- 🔍 FULL SCREEN ZOOM MODAL (DABBA) -->
    <div id="imageModal" onclick="closeZoom()">
        <span class="close-btn" onclick="closeZoom()">×</span>
        <img id="modalImage">
    </div>

    <!-- FIREBASE AND JAVASCRIPT CODE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgt_FpIn3fqUsSJGe7L7gr4wApPZEdMos",
            authDomain: "yourvault-f650c.firebaseapp.com",
            projectId: "yourvault-f650c",
            storageBucket: "yourvault-f650c.firebasestorage.app",
            messagingSenderId: "777606101043",
            appId: "1:777606101043:web:33e47a67decdf40c224b46"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const API_KEY = "E59dffa4691f853680e4c3efc19b2703";
        const urlParams = new URLSearchParams(window.location.search);
        const folderName = urlParams.get('folder') || 'default_folder';
        const loggedInUser = (localStorage.getItem("vaultUser") || "guest").toLowerCase();
        const displayName = loggedInUser.charAt(0).toUpperCase() + loggedInUser.slice(1);

        document.getElementById('galleryTitle').innerText = folderName.replace('_', ' ') + " Gallery 📸";

        // Admin section show karna
        if (loggedInUser === "chinmay") {
            document.getElementById("adminUploadSection").style.display = "block";
        }

        // --- ZOOM IN / ZOOM OUT FUNCTIONS ---
        window.openZoom = (url) => {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = "block";
            modalImg.src = url;
        };

        window.closeZoom = () => {
            document.getElementById('imageModal').style.display = "none";
        };

        // --- MULTI-UPLOAD FUNCTION WITH LOOP ---
        window.uploadToCloud = async () => {
            const fileInput = document.getElementById('uploadInput');
            const loadingMsg = document.getElementById('loadingMsg');
            const files = fileInput.files;
            
            if (files.length === 0) {
                alert("Bhai pehle kam se kam ek photo toh select kar!");
                return;
            }
            
            loadingMsg.style.display = "block";
            
            for (let i = 0; i < files.length; i++) {
                loadingMsg.innerText = `Uploading photo ${i + 1} of ${files.length}... ⏳`;
                
                let formData = new FormData();
                formData.append("image", files[i]);

                try {
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                        method: "POST",
                        body: formData
                    });
                    
                    const data = await response.json();

                    if(data.success) {
                        const imageUrl = data.data.display_url;
                        
                        await addDoc(collection(db, "galleryPhotos"), {
                            folder: folderName,
                            url: imageUrl,
                            timestamp: serverTimestamp()
                        });
                    } else {
                        console.error(`Photo ${i + 1} fail ho gayi!`);
                    }
                } catch (err) {
                    console.error("Internet error for photo", i + 1);
                }
            } 

            loadingMsg.innerText = "All Photos Uploaded Successfully! ✨📸";
            fileInput.value = ""; 
            setTimeout(() => { loadingMsg.style.display = "none"; }, 3000);
        };

        // --- LIVE LOAD PHOTOS FROM FIREBASE ---
        const photosQuery = query(collection(db, "galleryPhotos"), where("folder", "==", folderName));
        onSnapshot(photosQuery, (snapshot) => {
            const grid = document.getElementById('photoGrid');
            if (snapshot.empty) {
                grid.innerHTML = "<p style='color:#888; width: 100%; text-align:center;'>No memories uploaded yet. ✨</p>";
                return;
            }
            grid.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                // 💥 YAHAN CHANGES KIYE HAIN: HEIGHT BADHAYI HAI AUR ONCLICK LAGAYA HAI 💥
                grid.innerHTML += `
                    <div class="photo-card" style="background: white; padding: 10px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center;">
                        <img src="${data.url}" alt="Memory" onclick="openZoom('${data.url}')" style="width: 100%; height: 280px; object-fit: cover; border-radius: 10px; cursor: pointer;">
                        <a href="${data.url}" target="_blank" download class="cute-btn" style="display: inline-block; margin-top: 10px; width: 80%; padding: 8px; text-decoration: none;">📥 Download</a>
                    </div>
                `;
            });
        });

        // --- LIVE COMMENTS SYSTEM ---
        const commentInput = document.getElementById("commentInput");
        const sendCommentBtn = document.getElementById("sendCommentBtn");

        sendCommentBtn.addEventListener("click", async () => {
            const text = commentInput.value.trim();
            if (text !== "") {
                await addDoc(collection(db, "galleryComments"), {
                    folder: folderName,
                    sender: displayName,
                    text: text,
                    timestamp: serverTimestamp()
                });
                commentInput.value = "";
            }
        });

        const commentsQuery = query(collection(db, "galleryComments"), where("folder", "==", folderName));
        onSnapshot(commentsQuery, (snapshot) => {
            const commentsList = document.getElementById('commentsList');
            if (snapshot.empty) {
                commentsList.innerHTML = "<p style='color:#999; font-size:12px; text-align:center;'>No comments yet. Be the first to leave one!</p>";
                return;
            }
            commentsList.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                commentsList.innerHTML += `
                    <div class="comment-item" style="padding: 5px 0; border-bottom: 1px solid #eee;">
                        <strong style="color: #db7093;">${data.sender}:</strong> <span style="color: #555;">${data.text}</span>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
