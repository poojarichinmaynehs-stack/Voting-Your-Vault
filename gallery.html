<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery 📸</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fff0f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px; color: #4a4a4a; min-height: 100vh; }
        
        .header-panel { background: rgba(255,255,255,0.75); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; display: inline-block; margin-bottom: 25px; margin-top: 40px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); max-width: 500px; width: 100%; }
        h2 { color: #db7093; margin-bottom: 10px; text-transform: capitalize; }
        
        .cute-btn { background: linear-gradient(135deg, #ff9a9e, #fecfef); color: #4a4a4a; border: none; padding: 10px 22px; border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4); transition: transform 0.2s; }
        .cute-btn:hover { transform: translateY(-2px); }
        .back-btn { position: fixed; left: 15px; top: 15px; background: rgba(255,255,255,0.9); color: #db7093; border: 1px solid #ff9a9e; z-index: 100; font-size: 13px; }
        
        input[type="file"] { margin-bottom: 12px; font-size: 13px; }
        #loadingMsg { display: none; color: #ff69b4; font-weight: bold; margin-top: 10px; animation: blink 1s infinite; font-size: 14px; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* GALLERY GRID & CARDS */
        .photo-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 900px; margin: 0 auto 40px auto; }
        .photo-card { background: white; padding: 10px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; width: 200px; position: relative; animation: fadeIn 0.5s; }
        .photo-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
        
        .download-btn { background: #ff758c; color: white; text-decoration: none; padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; box-shadow: 0 2px 5px rgba(255,117,140,0.3); transition: background 0.2s; }
        .download-btn:hover { background: #ff4757; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* COMMENTS SECTION */
        .comments-panel { max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.85); padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); text-align: left; }
        .comments-panel h3 { color: #db7093; margin-bottom: 15px; text-align: center; }
        .comment-item { background: white; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); font-size: 13px; }
        .comment-item .author { font-weight: bold; color: #ff69b4; margin-right: 5px; }
        .comment-input-box { display: flex; gap: 10px; margin-top: 15px; }
        .comment-input-box input { flex: 1; padding: 10px 15px; border-radius: 15px; border: 1px solid #ffb6c1; outline: none; font-size: 13px; }
    </style>
</head>
<body>

    <button class="cute-btn back-btn" onclick="window.location.href='vault.html'">⬅ Back to Vault</button>
    
    <div class="header-panel">
        <h2 id="galleryTitle">Gallery ✨</h2>
        
        <div id="adminUploadSection" style="display: none;">
            <p style="font-size: 13px; color: #777; margin-bottom: 15px;">Admin Cloud Upload 👑</p>
            <input type="file" id="uploadInput" accept="image/jpeg, image/png, image/jpg">
            <button class="cute-btn" onclick="uploadToCloud()">Upload to Cloud 🚀</button>
            <p id="loadingMsg">Uploading photo directly to internet... Please wait ☁️⏳</p>
        </div>
    </div>

    <div class="photo-grid" id="photoGrid"></div>

    <div class="comments-panel">
        <h3>Memory Comments 💬</h3>
        <div id="commentsList">
            <p style="color:#999; font-size:12px; text-align:center;">No comments yet. Be the first to leave one!</p>
        </div>
        <div class="comment-input-box">
            <input type="text" id="commentInput" placeholder="Write a comment about these memories...">
            <button class="cute-btn" id="sendCommentBtn" style="padding: 10px 18px;">Post</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgt_FpIn3fqUsSJGe7L7gr4wApPZEdMos",
            authDomain: "yourvault-f650c.firebaseapp.com",
            projectId: "yourvault-f650c",
            storageBucket: "yourvault-f650c.firebasestorage.app",
            messagingSenderId: "777606101043",
            appId: "1:777606101043:web:33e47a67decdf40c224b46"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const API_KEY = "E59dffa4691f853680e4c3efc19b2703";
        const urlParams = new URLSearchParams(window.location.search);
        const folderName = urlParams.get('folder') || 'default_folder';
        const loggedInUser = (localStorage.getItem("vaultUser") || "guest").toLowerCase();
        const displayName = loggedInUser.charAt(0).toUpperCase() + loggedInUser.slice(1);

        document.getElementById('galleryTitle').innerText = folderName.replace('_', ' ') + " Gallery 📸";

        // Admin Upload Section check
        if (loggedInUser === "chinmay") {
            document.getElementById("adminUploadSection").style.display = "block";
        }

        // --- UPLOAD TO IMGBB & SAVE TO FIREBASE ---
        window.uploadToCloud = () => {
            const fileInput = document.getElementById('uploadInput');
            const loadingMsg = document.getElementById('loadingMsg');
            
            if (!fileInput.files.length) return;
            loadingMsg.style.display = "block";
            
            let formData = new FormData();
            formData.append("image", fileInput.files[0]);

            fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(async (data) => {
                if(data.success) {
                    const imageUrl = data.data.display_url;
                    
                    // Firebase Firestore mein photo ka link save karo taaki sabhi users ko dikhe
                    await addDoc(collection(db, "galleryPhotos"), {
                        folder: folderName,
                        url: imageUrl,
                        timestamp: serverTimestamp()
                    });

                    loadingMsg.style.display = "none";
                    fileInput.value = ""; 
                } else {
                    alert("Upload fail!");
                    loadingMsg.style.display = "none";
                }
            })
            .catch(err => {
                alert("Internet Error!");
                loadingMsg.style.display = "none";
            });
        };

        // --- LIVE LOAD PHOTOS FROM FIREBASE ---
        const photosQuery = query(collection(db, "galleryPhotos"), where("folder", "==", folderName));
        onSnapshot(photosQuery, (snapshot) => {
            const grid = document.getElementById('photoGrid');
            if (snapshot.empty) {
                grid.innerHTML = "<p style='color:#888; width: 100%;'>No memories uploaded yet. ✨</p>";
                return;
            }
            grid.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                grid.innerHTML += `
                    <div class="photo-card">
                        <img src="${data.url}" alt="Memory">
                        <a href="${data.url}" target="_blank" download class="download-btn">📥 Download</a>
                    </div>
                `;
            });
        });

        // --- LIVE COMMENTS SYSTEM ---
        const commentInput = document.getElementById("commentInput");
        const sendCommentBtn = document.getElementById("sendCommentBtn");

        sendCommentBtn.addEventListener("click", async () => {
            const text = commentInput.value.trim();
            if (text !== "") {
                await addDoc(collection(db, "galleryComments"), {
                    folder: folderName,
                    sender: displayName,
                    text: text,
                    timestamp: serverTimestamp()
                });
                commentInput.value = "";
            }
        });

        const commentsQuery = query(collection(db, "galleryComments"), where("folder", "==", folderName));
        onSnapshot(commentsQuery, (snapshot) => {
            const commentsList = document.getElementById('commentsList');
            if (snapshot.empty) {
                commentsList.innerHTML = "<p style='color:#999; font-size:12px; text-align:center;'>No comments yet. Be the first to leave one!</p>";
                return;
            }
            commentsList.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                commentsList.innerHTML += `
                    <div class="comment-item">
                        <span class="author">${data.sender}:</span> ${data.text}
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
